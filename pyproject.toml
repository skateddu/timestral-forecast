[project]
name = "timestral-forecast"
version = "0.1.0"
description = "Benchmark of Mistral's Timestral foundation model against statistical and machine learning baselines on M5 retail demand"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Andrea Cadeddu", email = "cadeddu7@gmail.com" },
]
keywords = [
    "time-series",
    "forecasting",
    "demand-forecasting",
    "foundation-model",
    "timestral",
    "m5",
    "statsforecast",
    "lightgbm",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "ipykernel>=7.3.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.10.9",
    "mlforecast>=1.1.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "statsforecast>=2.1.1",
    "timestral>=1.0.0",
    "torch>=2.11.0",
    "utilsforecast>=0.2.17",
]

[project.urls]
Homepage = "https://github.com/skateddu/timestral-forecast"
Repository = "https://github.com/skateddu/timestral-forecast"
Issues = "https://github.com/skateddu/timestral-forecast/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timestral_forecast"]

[tool.hatch.metadata]
# timestral is installed from its GitHub repository (it is not on PyPI)
allow-direct-references = true

[tool.uv.sources]
# pinned to a commit of the official inference repository
timestral = { git = "https://github.com/mistralai/timestral.git", rev = "a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests requiring external services",
]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["timestral_forecast"]
omit = ["*/plotting.py"]

[tool.ruff]
src = ["src"]
line-length = 99
target-version = "py310"
# private research notes, never committed
extend-exclude = ["notes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["timestral_forecast"]

[tool.ruff.lint.per-file-ignores]
# notebook: OPENBLAS_NUM_THREADS must be set before the numpy import, long lines and
# hand-wrapped import blocks are kept for readability
"*.ipynb" = ["E402", "E501", "I001"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]
